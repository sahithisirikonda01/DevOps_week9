apiVersion: apps/v1
kind: Deployment

metadata:
  name: kubedemoapp-deployment

spec:
  replicas: 4

  selector:
    matchLabels:
      app: kubedemoapp

  template:
    metadata:
      labels:
        app: kubedemoapp

    spec:
      containers:
        - name: kubedemoapp
          image: sahithisirikonda01/student-registration:latest
          ports:
            - containerPort: 5000